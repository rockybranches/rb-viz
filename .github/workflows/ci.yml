name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generated files are up to date
        run: npm run check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The default (dev) group only: the notebook test needs the private rb-rimrock and is skipped.
      # --frozen, because checking the lock file would need to read that private repository.
      - run: uv sync --frozen
      - run: uv run --frozen pytest
