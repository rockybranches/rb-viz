[project]
name = "rb-viz"
version = "0.3.0"
description = "Shared data visualization components for rockybranches projects"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Robbie Capps", email = "rocapp@gmail.com" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
plotly = ["plotly>=5.24"]
maps = [
    "branca",
    "folium",
    "geopandas>=1.0",
    "mapclassify",
]
all = ["rb-viz[plotly,maps]"]

[project.urls]
Source = "https://github.com/rockybranches/rb-viz"

[dependency-groups]
dev = [
    "pytest>=8",
    "rb-viz[all]",
]
# what notebooks/rimrock.ipynb needs on top of rb-viz: `uv sync --group notebooks`
notebooks = [
    "ipython>=9.15.0",
    "jupyter>=1.1.1",
    "rb-rimrock[plots]",
    "rb-viz[all]",
    "scipy>=1.17.1",
]

[tool.uv]
# rb-rimrock needs Python >= 3.12
environments = ["python_version >= '3.12'"]

[tool.uv.sources]
# private repo; pinned to main after rb-rimrock PR #2 was merged
rb-rimrock = { git = "https://github.com/rockybranches/rb-rimrock", rev = "2ee7d478e593a9f374f5509b4bc9bcba4a6d2890" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_viz"]
