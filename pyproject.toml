[tool.poetry]
name = "rb-viz"
version = "0.1.0"
description = ""
authors = ["Robbie Capps <rocapp@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
open3d = "^0.18.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "geopandas>=1.1.4",
    "ipython>=9.15.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "rb-rimrock[plots]",
    "scipy>=1.17.1",
]

[tool.uv]
# rb-rimrock needs Python >= 3.12
environments = ["python_version >= '3.12'"]

[tool.uv.sources]
# private repo; pinned to main after rb-rimrock PR #2 was merged
rb-rimrock = { git = "https://github.com/rockybranches/rb-rimrock", rev = "2ee7d478e593a9f374f5509b4bc9bcba4a6d2890" }
